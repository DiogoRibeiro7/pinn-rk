name: Release

# Manual only. This workflow is not yet functional: it runs
# `semantic-release publish`, but python-semantic-release 9.x splits versioning
# and tagging into `semantic-release version`, and `publish` merely uploads
# assets to an existing release. It also needs a [tool.semantic_release] section
# in pyproject.toml declaring the two version locations (pyproject and
# src/pinn_rk/__about__.py). Until both are addressed, releases are cut by hand.
on:
  workflow_dispatch:

permissions:
  contents: write           # needed to push tags and CHANGELOG.md
  issues: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        uses: abatilo/actions-poetry@v2
        with:
          poetry-version: "1.8.3"

      - name: Install semantic-release
        run: |
          poetry self add "poetry-dynamic-versioning[plugin]" || true  # optional
          pip install python-semantic-release==9.*

      - name: Semantic Release (version, changelog, tag, GitHub release)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # provided by GitHub; sufficient for releases
        run: semantic-release publish
