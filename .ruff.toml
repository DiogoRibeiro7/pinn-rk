line-length = 100
target-version = "py311"

[format]
# Ruff 0.16 began formatting Python inside Markdown fences. The snippets in README.md,
# SECURITY.md and the docs pages align their trailing comments deliberately, in tables of
# options and tableau listings where the alignment is what makes them readable, and the
# formatter collapses that. Markdown is therefore excluded from formatting only.
# `ruff check` still lints these blocks, so genuinely broken snippets are still caught.
exclude = ["*.md"]

[lint]
select = ["E", "F", "I", "UP", "B", "C4", "T20", "RUF"]
ignore = [
    "E501",    # Line too long (handled by formatter)
    "B008",    # Do not perform function call in argument defaults (we use torch.device)
    "RUF001",  # Ambiguous unicode characters (we use proper math symbols)
    "RUF002",  # Ambiguous unicode in docstrings (we use LaTeX-style math)
]

[lint.per-file-ignores]
# Allow print statements in examples
"examples/*.py" = ["T201"]
"src/pinn_rk/examples/*.py" = ["T201"]
# Relax some rules for tests
"tests/*.py" = ["T201"]
# Notebooks: print is how a notebook reports results, and dict(...) rather than a
# literal is the idiom throughout Plotly's own documentation.
"examples/notebooks/*.ipynb" = ["T201", "C408"]
