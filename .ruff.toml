line-length = 100
target-version = "py311"

[lint]
select = ["E", "F", "I", "UP", "B", "C4", "T20", "RUF"]
ignore = [
    "E501",    # Line too long (handled by formatter)
    "B008",    # Do not perform function call in argument defaults (we use torch.device)
    "RUF001",  # Ambiguous unicode characters (we use proper math symbols)
    "RUF002",  # Ambiguous unicode in docstrings (we use LaTeX-style math)
]

[lint.per-file-ignores]
# Allow print statements in examples
"examples/*.py" = ["T201"]
"src/pinn_rk/examples/*.py" = ["T201"]
# Relax some rules for tests
"tests/*.py" = ["T201"]
