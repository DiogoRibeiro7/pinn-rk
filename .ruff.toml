line-length = 100
target-version = "py311"
select = ["E", "F", "I", "UP", "B", "C4", "T20", "RUF"]
ignore = [
    "E501",  # Line too long (handled by formatter)
]

[per-file-ignores]
# Allow print statements in examples
"examples/*.py" = ["T201"]
# Allow print statements in example train script
"src/pinn_rk/examples/*.py" = ["T201"]
# Relax some rules for tests
"tests/*.py" = ["T201"]
