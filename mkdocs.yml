site_name: pinn-rk Documentation
site_description: Runge-Kutta Physics-Informed Neural Networks in PyTorch
site_author: Diogo Ribeiro
site_url: https://diogoribeiro7.github.io/pinn-rk

repo_url: https://github.com/DiogoRibeiro7/pinn-rk
repo_name: DiogoRibeiro7/pinn-rk
edit_uri: edit/main/docs/

copyright: Copyright &copy; 2025 Diogo Ribeiro

theme:
  name: material
  language: en
  palette:
    # Light mode
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  
  font:
    text: Roboto
    code: Roboto Mono
  
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.tracking
    - search.suggest
    - search.highlight
    - search.share
    - toc.integrate
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
  
  icon:
    repo: fontawesome/brands/github
    admonition:
      note: octicons/tag-16
      abstract: octicons/checklist-16
      info: octicons/info-16
      tip: octicons/squirrel-16
      success: octicons/check-16
      question: octicons/question-16
      warning: octicons/alert-16
      failure: octicons/x-circle-16
      danger: octicons/zap-16
      bug: octicons/bug-16
      example: octicons/beaker-16
      quote: octicons/quote-16

plugins:
  - search:
      separator: '[\s\-,:!=\[\]()"/]+|(?!\b)(?=[A-Z][a-z])|\.(?!\d)|&[lg]t;'
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          options:
            docstring_style: numpy
            show_source: true
            show_root_heading: true
            show_root_toc_entry: true
            show_object_full_path: false
            show_category_heading: true
            show_if_no_docstring: false
            show_signature: true
            show_signature_annotations: true
            separate_signature: true
            members_order: source
            group_by_category: true
            show_submodules: false
  - git-revision-date-localized:
      enable_creation_date: true
      enable_git_follow: false
      # Snippet-assembled pages have no git history of their own; use the build date
      # rather than failing. Note the plugin still emits one warning about the docs
      # directory itself, so `mkdocs build --strict` is not clean for that reason
      # alone. `gh-deploy` does not use --strict, and CI does not build the docs.
      fallback_to_build_date: true
      type: timeago

nav:
  - Home: index.md
  - Getting Started:
    - Installation: getting-started/installation.md
    - Quick Start: getting-started/quickstart.md
  - Theory:
    - RK-PINN Formulation: theory/rk-pinn-formulation.md
  - API Reference:
    - Configuration: api/config.md
    - Butcher Tableaux: api/tableau.md
    - Time Mesh: api/mesh.md
    - Interpolants: api/interpolants.md
    - Operators: api/operators.md
    - Models: api/model.md
    - Loss Functions: api/loss.md
  - Examples:
    - Overview: examples/overview.md
  - Development:
    - Contributing: contributing.md
    - Roadmap: roadmap.md
    - Changelog: changelog.md

# Pages under Development/ and Examples/ are pulled in from the repository root with
# pymdownx.snippets. Their relative links (./ROADMAP.md, ../CITATION.cff) are correct on
# GitHub but point outside the docs tree, so they cannot resolve here. Report rather than
# fail on those, while keeping --strict meaningful for genuine problems such as a nav
# entry with no page behind it.
validation:
  omitted_files: warn
  links:
    # Development/ and Examples/ pages are snippet includes of files that live at the
    # repository root, where their relative links are correct. Those same links point
    # outside the docs tree here and cannot resolve, so they are reported rather than
    # fatal. Nav validation stays strict, so a nav entry with no page still fails.
    not_found: info
    absolute_links: info
    unrecognized_links: info

markdown_extensions:
  # Python Markdown
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - toc:
      permalink: true
      toc_depth: 3
  
  # Python Markdown Extensions
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  # These must be Python object references, not quoted strings: Markdown calls them.
  # As plain strings the build aborts with "TypeError: unsupported callable".
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde
  - pymdownx.snippets:
      base_path: ['.']
      check_paths: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/DiogoRibeiro7/pinn-rk
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/pinn-rk/
  analytics:
    provider: google
    property: ""
  version:
    provider: mike

extra_css:
  - stylesheets/extra.css

extra_javascript:
  # polyfill.io was removed deliberately: the domain changed hands in 2024 and
  # served malicious code. Modern browsers need no polyfill for MathJax 3.
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
